# Parâmetros de AOI e janela temporal — decididos em SV-02 (docs/tarefas/SV-02-...).
# Ver docs/decisoes/ADR-001-aoi-e-janela-temporal.md para o raciocínio completo.

faixa_a:
  anos: [2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
  sensor_por_ano:
    2013: landsat
    2014: landsat
    2015: landsat
    2016: landsat
    2017: landsat
    2018: landsat
    2019: sentinel2
    2020: sentinel2
    2021: sentinel2
    2022: sentinel2
    2023: sentinel2
    2024: sentinel2
    2025: sentinel2
  # Anos ingeridos nos DOIS sensores (Landsat 8 E Sentinel-2), usados por SV-20 para medir o
  # viés de instrumentação entre sensores.
  anos_sobreposicao: [2019, 2020, 2021]

faixa_b:
  habilitada: false
  anos: [2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011]
  # Habilitar somente se SV-02b validar harmonização TM->OLI dentro de tolerância aceitável
  # E SV-05b adotar uma fonte de label anual que cubra o período (WorldCover não cobre).

mes_inicio: 6   # composto anual de estação seca (jun-set), reduz nuvem e sombra
mes_fim: 9

crs_analise: "EPSG:31983"   # SIRGAS 2000 / UTM 23S — usado para buffer/área
crs_config: "EPSG:4326"     # CRS de config/sites.geojson

resolucao_m:
  sentinel2: 10
  landsat: 30

seed: 42
