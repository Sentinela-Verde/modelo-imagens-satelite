# Contrato de dados externos — SV-28
#
# Uma entrada por variável. Cobre as ~75 linhas da tabela principal da página Notion
# "Propostas de variáveis" + 18 variáveis adicionadas por este documento (ver `origem`).
#
# Campos por entrada:
#   id                     - identificador estável, snake_case
#   nome                   - nome legível
#   dimensao               - ambiental | social | economica | infraestrutura | governanca | temporal
#   papel                  - A (entrada do modelo) | B (variável de impacto) | C (confundidor/controle)
#                            | D (contexto/estratificação) — ver docs/requisitos-dados-externos.md secao 1
#   unidade                - unidade de medida ou "categorico"
#   granularidade_espacial - pixel | aoi | setor_censitario | municipio | estacao
#   granularidade_temporal - anual | mensal | estatico
#   fonte                  - origem do dado
#   mecanismo_acesso       - como se obtém (API, STAC, download, Overpass, GEE, calculo proprio,
#                            dado do cliente/operador)
#   licenca                - licenca/termos de uso da fonte
#   onda                   - 1 | 2 | 3 | 4 | fora_de_escopo | null
#                            null = nao e' um pedido de dado externo (ja implementado por este
#                            repositorio ou metadado proprio de SV-24/25/29/30)
#   esforco                - baixo | medio | alto
#   bloqueadores           - texto curto, "nenhum" se nao houver
#   parecer                - parecer da frente de ML sobre a variavel
#   usado_neste_repo       - true/false — este repositorio ja entrega (ou vai entregar, dentro do
#                            seu proprio escopo/roadmap) este dado, sem depender da Engenharia
#   origem                 - notion_propostas_variaveis | adicionado_sv28 (variavel que NAO estava
#                            na tabela original do Notion e foi incluida/promovida por este documento)

versao: "1.0"
gerado_em: "2026-08-31"
legenda_onda:
  "1": "habilita afirmacao de impacto — clima + areas protegidas + malhas IBGE"
  "2": "contexto territorial estatico — OSM/Overpass, SRTM/Copernicus DEM"
  "3": "hidrologia e fogo — ANA HidroWeb, MapBiomas Fogo/Alerta"
  "4": "socioeconomico — IBGE setor censitario, RAIS/CAGED (maior esforco, menor poder de deteccao)"
  fora_de_escopo: "nao publico, nao vinculavel ao empreendimento, ou baixa relacao com o objetivo ambiental"
  "null": "nao e pedido de dado externo — ja implementado por este repositorio ou metadado proprio"

